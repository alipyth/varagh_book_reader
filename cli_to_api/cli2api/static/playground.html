<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cli2api playground</title>
<style>
  :root { --bg:#0b1020; --panel:#121a33; --line:#24305a; --text:#e6eaf7; --muted:#8c97bd; --accent:#7c9cff; --ok:#3ddc97; --err:#ff6b81; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Vazirmatn, Tahoma, sans-serif; background:radial-gradient(circle at 20% 0%, #1a2550 0, var(--bg) 55%); color:var(--text); min-height:100vh; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { margin:0; font-size:26px; letter-spacing:-.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 24px; }
  .card { background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.6px; }
  select, input, textarea { width:100%; background:#0b1228; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  textarea { min-height:120px; resize:vertical; }
  .grow { flex:1; min-width:200px; }
  button { background: var(--accent); color:#0b1020; border:0; border-radius:10px; padding:11px 20px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .check { display:flex; gap:8px; align-items:center; color:var(--muted); }
  .check input { width:auto; }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; font:14px/1.6 ui-monospace, Consolas, monospace; unicode-bidi: plaintext; }
  .meta { color: var(--muted); font-size:13px; margin-top:10px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; border:1px solid var(--line); margin:2px 4px 2px 0; font-size:12px; }
  .pill.on { border-color: var(--ok); color: var(--ok); }
  .pill.off { color: var(--muted); text-decoration: line-through; }
  .err { color: var(--err); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>cli<span>2</span>api <small style="color:var(--muted);font-weight:400">playground</small></h1>
  <p class="sub">Your local AI CLIs, behind an OpenAI-compatible API. <a href="/docs">API docs</a></p>

  <div class="card">
    <label>Providers on this machine</label>
    <div id="providers">loading…</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="grow"><label for="model">Model</label><select id="model"></select></div>
      <div class="grow"><label for="key">API key (if set)</label><input id="key" type="password" placeholder="optional"></div>
    </div>
    <div style="margin-top:12px">
      <label for="sys">System prompt</label>
      <input id="sys" placeholder="optional, e.g. You are a concise assistant." dir="auto">
    </div>
    <div style="margin-top:12px">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" dir="auto">Explain in two sentences what an API gateway is.</textarea>
    </div>
    <div class="row" style="margin-top:12px; justify-content:space-between">
      <div class="row">
        <span class="check"><input id="stream" type="checkbox" checked> stream</span>
        <span class="check"><input id="json" type="checkbox"> JSON mode</span>
      </div>
      <button id="send">Send ▶</button>
    </div>
  </div>

  <div class="card">
    <label>Response</label>
    <pre id="out" dir="auto">—</pre>
    <div class="meta" id="meta"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const headers = () => {
  const h = { "Content-Type": "application/json" };
  const k = $("key").value.trim();
  if (k) h["Authorization"] = "Bearer " + k;
  return h;
};
$("key").value = localStorage.getItem("cli2api_key") || "";
$("key").addEventListener("change", () => { localStorage.setItem("cli2api_key", $("key").value); load(); });

async function load() {
  try {
    const [p, m] = await Promise.all([
      fetch("/v1/providers", { headers: headers() }).then(r => r.json()),
      fetch("/v1/models", { headers: headers() }).then(r => r.json()),
    ]);
    if (p.error) throw new Error(p.error.message);
    $("providers").innerHTML = p.data.map(x => {
      const on = x.type !== "cli" || x.installed;
      return `<span class="pill ${on ? "on" : "off"}" title="${x.description || ""}">${x.id}</span>`;
    }).join("");
    $("model").innerHTML = m.data.map(x => `<option>${x.id}</option>`).join("");
  } catch (e) {
    $("providers").innerHTML = `<span class="err">${e.message}</span>`;
  }
}

$("send").onclick = async () => {
  const messages = [];
  if ($("sys").value.trim()) messages.push({ role: "system", content: $("sys").value });
  messages.push({ role: "user", content: $("prompt").value });
  const body = { model: $("model").value, messages, stream: $("stream").checked };
  if ($("json").checked) body.response_format = { type: "json_object" };
  $("send").disabled = true; $("out").textContent = ""; $("out").className = ""; $("meta").textContent = "running…";
  const t0 = performance.now();
  try {
    const r = await fetch("/v1/chat/completions", { method: "POST", headers: headers(), body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json()).error?.message || r.statusText);
    if (!body.stream) {
      const j = await r.json();
      $("out").textContent = j.choices[0].message.content;
    } else {
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const events = buf.split("\n\n"); buf = events.pop();
        for (const ev of events) {
          const data = ev.replace(/^data: /, "").trim();
          if (!data || data === "[DONE]") continue;
          const j = JSON.parse(data);
          if (j.error) throw new Error(j.error.message);
          $("out").textContent += j.choices[0].delta.content || "";
        }
      }
    }
    $("meta").textContent = `${body.model} · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
  } catch (e) {
    $("out").className = "err"; $("out").textContent = e.message; $("meta").textContent = "";
  } finally { $("send").disabled = false; }
};
load();
</script>
</body>
</html>
